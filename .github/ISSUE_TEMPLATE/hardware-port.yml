name: Suggest a device for a hardware port
description: Tell us which board you would play on and how you would use it.
title: "[Hardware port] "
body:
  - type: input
    id: board
    attributes:
      label: Exact device or board model
      description: Include the revision and a manufacturer or product link if available.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: How would you use it to play your character?
      description: Tell us where you would use it and which controls matter to you. Mention its screen, touch, dial or buttons if you know them.
    validations:
      required: true
